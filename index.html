<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>یه سؤال کوچولو 🌻</title>
<style>
:root{--deep:#5c3a14;--yes:#ffbf00;--no:#fff1a8}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{font-family:"B Nazanin","BNazanin",Tahoma,Arial,sans-serif;color:var(--deep);
background:
radial-gradient(circle at 10% 15%,#5b3715 0 18px,#f5bd16 19px 31px,transparent 32px),
radial-gradient(circle at 82% 22%,#684019 0 20px,#ffd43a 21px 35px,transparent 36px),
linear-gradient(135deg,#f7e889,#f8c94f 50%,#f0b93c)}
main{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(700px,92vw);padding:42px 26px 34px;border-radius:32px;text-align:center;background:rgba(255,251,224,.93);box-shadow:0 18px 50px rgba(77,55,0,.22)}
.tiny{font-size:24px;font-weight:800;margin-bottom:8px}
h1{font-size:clamp(28px,5vw,44px);margin:18px 0 34px}
.buttons{display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap;min-height:110px}
button{border:0;border-radius:999px;font:800 20px inherit;cursor:pointer;transition:.25s;box-shadow:0 10px 24px rgba(91,62,0,.16)}
#yes{background:var(--yes);padding:16px 38px;color:#533500}
#no{background:var(--no);padding:14px 32px;color:#654712}
.stage{display:none}
.picker-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{background:rgba(255,255,255,.62);border-radius:20px;padding:18px;text-align:right}
.title{font-weight:800;margin-bottom:12px}
.date-row,.time-row{display:grid;gap:8px;align-items:center}
.date-row{grid-template-columns:1fr 1fr}
.time-row{grid-template-columns:1fr auto 1fr}
select{width:100%;font:inherit;font-size:17px;padding:12px 8px;border:1px solid rgba(100,70,15,.18);border-radius:12px;background:#fffdf1;color:var(--deep)}
.month{padding:12px 8px;background:#fffdf1;border:1px solid rgba(100,70,15,.18);border-radius:12px;text-align:center;font-weight:800}
.summary{margin:18px 0 14px;font-weight:700}
#next,#go{background:#6f8f45;color:#fff;padding:14px 34px}
#next:disabled,#go:disabled{opacity:.4;cursor:not-allowed}
.food-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.food{border-radius:20px;padding:20px;background:rgba(255,255,255,.72);color:var(--deep);display:flex;flex-direction:column;gap:8px;align-items:center}
.food .ico{font-size:40px}
.food.selected{background:#fff1a8;outline:2px solid #dca900}
#goWrap{display:none;margin-top:22px}
.status{margin-top:14px;font-size:14px;min-height:24px}
@media(max-width:600px){.picker-grid{grid-template-columns:1fr}.food-grid{grid-template-columns:1fr 1fr}.card{padding:34px 18px}}
@media(max-width:390px){.food-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<section class="card">
<div class="tiny" id="tiny">سلام شیرین 🌻</div>
<h1 id="question">پایه‌ای دوتایی بریم بیرون؟</h1>

<div id="s1">
<div class="buttons">
<button id="yes" type="button">آره 😍</button>
<button id="no" type="button">نه 🙃</button>
</div>
<div class="status" id="hint"></div>
</div>

<div class="stage" id="s2">
<div class="picker-grid">
<div class="box">
<div class="title">📅 انتخاب تاریخ</div>
<div class="date-row">
<select id="day"><option value="">روز</option></select>
<div class="month">شهریور</div>
</div>
</div>
<div class="box">
<div class="title">🕒 انتخاب ساعت</div>
<div class="time-row">
<select id="minute"><option value="">دقیقه</option></select>
<div>:</div>
<select id="hour"><option value="">ساعت</option></select>
</div>
</div>
</div>
<div class="summary" id="summary">تاریخ و ساعت را انتخاب کن 🌻</div>
<button id="next" type="button" disabled>بعدی ←</button>
</div>

<div class="stage" id="s3">
<div class="food-grid">
<button class="food" type="button" data-food="قهوه"><span class="ico">☕️</span><span>قهوه</span></button>
<button class="food" type="button" data-food="پیتزا"><span class="ico">🍕</span><span>پیتزا</span></button>
<button class="food" type="button" data-food="ساندویچ کثیف"><span class="ico">🌭🔥</span><span>ساندویچ کثیف</span></button>
<button class="food" type="button" data-food="کباب"><span class="ico">🍢🥩</span><span>کباب</span></button>
</div>
<div id="goWrap"><button id="go" type="button">بزن بریم 🚗✨</button></div>
<div class="status" id="saveStatus"></div>
</div>
</section>
</main>

<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const s1=$("s1"),s2=$("s2"),s3=$("s3"),q=$("question"),tiny=$("tiny");
const yes=$("yes"),no=$("no"),hint=$("hint"),day=$("day"),hour=$("hour"),minute=$("minute");
const next=$("next"),summary=$("summary"),goWrap=$("goWrap"),go=$("go"),saveStatus=$("saveStatus");

let noClicks=0,dateText="",timeText="",food="";
const fa=v=>String(v).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const hints=["مطمئنی؟ 👀","یه بار دیگه فکر کن 😄","گزینه آره داره جذاب‌تر می‌شه…","نه دیگه خیلی کوچولو شده 😌","تقریباً فقط یه انتخاب مونده 😇","خب… دیگه «نه» نداریم 😎"];

for(let d=10;d<=31;d++){let o=document.createElement("option");o.value=d;o.textContent=fa(d);day.appendChild(o)}
for(let h=0;h<24;h++){let v=String(h).padStart(2,"0"),o=document.createElement("option");o.value=v;o.textContent=fa(v);hour.appendChild(o)}
for(let m=0;m<60;m+=5){let v=String(m).padStart(2,"0"),o=document.createElement("option");o.value=v;o.textContent=fa(v);minute.appendChild(o)}

no.addEventListener("click",()=>{
noClicks++;
no.style.transform=`scale(${Math.max(.08,1-noClicks*.17)})`;
yes.style.transform=`scale(${1+noClicks*.13})`;
hint.textContent=hints[Math.min(noClicks-1,hints.length-1)];
if(noClicks>=6) no.style.display="none";
});

yes.addEventListener("click",()=>{
s1.style.display="none";s2.style.display="block";
tiny.textContent="پس بریم سراغ هماهنگی 😌";q.textContent="کی وقت داری؟";
});

function update(){
if(day.value&&hour.value!==""&&minute.value!==""){
dateText=`${fa(day.value)} شهریور`;
timeText=`${fa(hour.value)}:${fa(minute.value)}`;
summary.textContent=`${dateText}، ساعت ${timeText} ✨`;
next.disabled=false;
}else{
next.disabled=true;
summary.textContent="تاریخ و ساعت را انتخاب کن 🌻";
}
}
day.addEventListener("change",update);
hour.addEventListener("change",update);
minute.addEventListener("change",update);

next.addEventListener("click",()=>{
s2.style.display="none";s3.style.display="block";
tiny.textContent="فقط یه انتخاب خوشمزه مونده 😋";
q.textContent="چی سفارش میدی؟";
});

document.querySelectorAll(".food").forEach(btn=>{
btn.addEventListener("click",()=>{
document.querySelectorAll(".food").forEach(b=>b.classList.remove("selected"));
btn.classList.add("selected");
food=btn.dataset.food;
goWrap.style.display="block";
});
});

go.addEventListener("click",async()=>{
if(!food)return;
const scriptUrl=window.INVITATION_CONFIG&&window.INVITATION_CONFIG.scriptUrl;
go.disabled=true;saveStatus.textContent="در حال ثبت انتخاب‌ها…";
try{
const params=new URLSearchParams({date:dateText,time:timeText,food:food});
await fetch(scriptUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:params.toString()});
window.location.href="result.html?"+params.toString();
}catch(err){
saveStatus.textContent="ثبت نتیجه انجام نشد؛ دوباره امتحان کن.";
go.disabled=false;
}
});
</script>
</body>
</html>
