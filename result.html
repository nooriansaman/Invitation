<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>قرارمون شد 🌻</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"B Nazanin","BNazanin",Tahoma,Arial,sans-serif;color:#5c3a14;background:linear-gradient(135deg,#f7e889,#f8c94f 50%,#f0b93c)}
.card{width:min(650px,92vw);background:rgba(255,251,224,.94);border-radius:30px;padding:34px 24px;text-align:center;box-shadow:0 18px 50px rgba(77,55,0,.22)}
h1{font-size:34px}.msg{background:rgba(255,255,255,.62);border-radius:24px;padding:24px;font-size:23px;line-height:2;text-align:right;font-weight:700}.small{margin-top:18px;font-size:13px;opacity:.6}
</style>
</head>
<body>
<section class="card">
<h1>خوشحالم که نه نگفتی 🌻</h1>
<div class="msg" id="msg"></div>
<div class="small">برای اینکه قبول کنی یه وبسایت برات طراحی کردم. چیز مهمی نیست که 😌</div>
</section>
<script>
const p=new URLSearchParams(location.search);
const date=p.get("date")||"";
const time=p.get("time")||"";
const food=p.get("food")||"";
document.getElementById("msg").innerHTML=
`خوشحالم که نه نگفتی.<br>پس <strong>${date}</strong> ساعت <strong>${time}</strong> میام دنبالت، برای <strong>${food}</strong>.<br><br>تو آماده شو، خودم میام دنبالت.`;
</script>
</body>
</html>
